[versions]
agp = "8.13.2"
kotlin = "2.1.21"
compose = "2025.05.01"
activity = "1.10.1"
lifecycle = "2.9.0"
datastore = "1.1.7"
osm = "6.1.20"
maplibre = "12.2.3"
play-location = "21.3.0"
junit = "4.13.2"
json = "20250517"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
maps-osm = { module = "org.osmdroid:osmdroid-android", version.ref = "osm" }
maps-maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
play-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-location" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
